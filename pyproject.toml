[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-normalize"
version = "0.1.1"
description = "TTS için Türkçe metin normalizasyonu: sayı, tarih, saat, para, kısaltma, Roma rakamı, kesir, e-posta ve adres okunuşu."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehmet Veysel Delibaş" }]
keywords = ["türkçe", "turkish", "tts", "text-normalization", "normalizasyon", "speech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/seslen-tr/turkce-normalize"
Source = "https://github.com/seslen-tr/turkce-normalize"
Issues = "https://github.com/seslen-tr/turkce-normalize/issues"

[project.scripts]
turkce-normalize = "turkce_normalize.__main__:main"

[tool.setuptools]
packages = ["turkce_normalize"]
